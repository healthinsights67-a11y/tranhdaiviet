  <body>
    <div id="root"></div>
    <script>
      // Fix for "Cannot set property fetch of #<Window> which has only a getter"
      // This happens if a library tries to polyfill fetch in an environment where it's read-only.
      try {
        const originalFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get: () => originalFetch,
          set: (v) => { console.warn('Attempted to override fetch, ignored to prevent crash. Requested value:', v); },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        console.warn('Could not define fetch safety wrap:', e);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
